[project]
# this is an early draft do not use dependencies really depend on weather you use at5 qt6 or something else
# you will always need pyqt as it is the compatibility layer
# a few tabs work only in QT6 or at least not in Qt5 -- see the wiki, or ask russ on help installing
name = "PyQtByExample"
version = "0.1.0"
description = "Example code for Python and Qt ( 5 6 and PySide ) "
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "qtpy",
    "unidecode>=1.3.0",
    "wat-inspector",
    "pyqtgraph",
    "matplotlib",
    "QScintilla",
    "python-vlc>=3.0.21203",
    "pyqtwebengine>=5.15.7",
]

[dependency-groups]
dev = [
    "pip>=26.1.2",
    "spyder-kernels>=3.1.5",
]

